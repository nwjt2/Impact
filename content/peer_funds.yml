        - guarantee
        - equity
      structure_notes: >
        Stichting Hivos-Triodos Fonds is a Dutch foundation (Stichting)
        co-founded in 1994 by Stichting Hivos and Triodos Bank, with
        Triodos Investment Management (a 100% subsidiary of Triodos
        Bank) acting as manager and forming the board of directors.
        Triodos UK confirms the fund is housed within the bank's "Co
        Financing Business Unit." For its first ~30 years the fund
        operated as a single-pool foundation funded by Hivos and Triodos
        Bank / Triodos retail-investor channels, with no publicly
        disclosed senior/junior share-class split between the two
        co-founders. In September 2025 FMO and OeEB signed a 10-year
        funding agreement contributing a combined EUR 30m, described by
        Hivos as "the first time that development finance institutions
        invest directly in Hivos-Triodos Fonds" — adding to the
        pre-existing EUR ~65m AUM and bringing total fund size to
        ~EUR 95m. FMO's project page lists its share at USD 20m; OeEB's
        individual size is not separately disclosed. No public source
        labels any tranche as senior/junior/first-loss, so a layer-by-
        layer capital stack cannot be constructed honestly. Downstream
        the fund deploys loans, subordinated loans, guarantees and
        equity into MFIs, sustainable-agriculture SMEs and renewable-
        energy SMEs. No standalone TA facility is named in public
        sources.
      structure_source_urls:
        - https://hivos.org/hivos-triodos-fonds-secures-eur-30-million-from-fmo-and-oeeb/
        - https://www.fmo.nl/news-detail/abf3b2ca-45e9-4302-928d-ff18d48b63e8/10-year-funding-agreement-with-hivos-triodos-fonds-to-support-smes-in-emerging-markets
        - https://www.fmo.nl/project-detail/64519
        - https://www.triodos.co.uk/projects/stichting-hivos-triodos-fonds
        - https://www.triodos-im.com/press-releases/2025/hivos-triodos-fonds-secures-eur-30-million-investment-from-fmo-and-oeeb-to-invest-in-smes-in-emerging-markets
    status: deployed
    public_source_url: https://hivos.org/program/hivos-triodos-fund/
    last_seen_at: 2026-05-06
    notes: >
      Established 1994 as a joint initiative of Stichting Hivos (Dutch
      humanist INGO) and Triodos Bank. AUM EUR 58.2m end-2023 (~$62m).
      Open-ended evergreen vehicle financing rural MFIs and renewable-
      energy SMEs. Triodos IM is the licensed manager; Hivos provides
      impact mandate and co-governance. One of the longest-running
