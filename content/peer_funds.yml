        used a senior + subordinated structure, but for SIF 6.0 no
        separately-named subordinated or first-loss tranche is publicly
        disclosed (the predecessor fund's catalytic layer was reduced as
        proof-of-concept matured). The parallel impact-advisory facility is
        a philanthropic sidecar funded out of Global Partnerships' donor
        contributions, with size not publicly disclosed. Fund deployed $280m+
        across 108 investees over its 10-year life and reached maturity in
