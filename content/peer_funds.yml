        Open Society Foundations, Pace Able, Proparco, Prudential
        Financial, Stichting Hivos-Triodos Fund, Visa) plus an additional
        $10M from Accion. The 2025 $61.6M Accion Venture Lab Fund II, LP
        is the next successor vehicle (tracked under
        accion-venture-lab-fund-ii). Portfolio support is provided
        in-kind via Accion's "Portfolio Engagement" team rather than a
        discrete parallel TA facility named in the public record.
