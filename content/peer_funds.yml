# Peer impact funds registry.
#
# ~50 entries, enriched with anchor LP, close dates, disclosed economics
# (fees/carry/hurdle/GP commit/investment period), sub-advisor + placement
# agent, parent-INGO country, and public source URL.
#
# Consumed by:
#   - Slot 1: "INGOs like you that closed a fund"  (filter by parent_ingo_country; INGO-sponsored entries only)
#   - Slot 2: cross-reference via fund_slug from content/dfi_ingo_commitments.yml
#
# Schema per entry:
#   slug:                                URL-stable kebab-case id (UNIQUE). Handshake key for dfi_ingo_commitments.yml.
#   name:                                canonical display string
#   manager:                             fund manager legal entity (who actually runs the vehicle)
#   parent_ingo:                         nullable; INGO sponsor if any (null = non-INGO comparable)
#   parent_ingo_country:                 ISO-2 of parent INGO HQ (null if no parent INGO)
#   vintage:                             integer year of first close (or announcement if not yet closed)
#   size_usd_m:                          nullable integer or string "TBD"
#   sector_tags:                         [list]
#   geo_tags:                            [list]
#   vehicle_type:                        closed_end_fund | evergreen | blended | DIB
#   announce_date:                       YYYY-MM-DD or null. Date the fund's
#                                        active fundraise was first publicly
#                                        announced (press release, INGO board
#                                        statement, or partner co-announcement).
#                                        Used by /timeline/ to compute
#                                        announce -> first-close duration.
#                                        Null where the public record only
#                                        names the close date.
#   announce_date_month_only:            true if announce_date day is a
#                                        placeholder (only month/year known)
#   first_close_date:                    YYYY-MM-DD or null
#   first_close_date_month_only:         true if first_close_date day is placeholder
#   final_close_date:                    YYYY-MM-DD or null
#   final_close_date_month_only:         true if final_close_date day is placeholder
#   timeline_days_announce_to_first_close: integer or null (computed at emit time; left null where announce date not public)
#   anchor_lp:                           named anchor commitment (free string) or null
#   mgmt_fee_bps:                        integer basis points (e.g. 175 = 1.75%) or null. DO NOT FABRICATE.
#   carry_pct:                           float carried interest % (e.g. 15.0) or null
#   hurdle_pct:                          float preferred return % (e.g. 8.0) or null
#   gp_commit_pct:                       float GP commitment as % of fund size or null
#   investment_period_years:             integer years or null
#   sub_advisor:                         named sub-advisor firm or null
#   placement_agent:                     named placement agent or null
#   blended_finance_structure:           OPTIONAL nested block — see schema below
#   status:                              raising | deployed | wound_down
#   public_source_url:                   link to press release / fund page / annual report
#   last_seen_at:                        YYYY-MM-DD — today's date for entries updated this round
#   notes:                               <=2 factual sentences
#
# Blended-finance structure (optional nested block):
#   blended_finance_structure:
#     capital_stack:                     ordered list, top (least risky) to bottom (most risky)
#       - tranche: senior_debt|junior_debt|mezzanine|equity|first_loss_equity|guarantee|grant
#         provider:                      free-text LP name
#         provider_slug:                 optional handshake → LP registry slug (foundations / dfis / etc.)
#         size_usd_m:                    nullable number
#         source_url:                    URL where this tranche is publicly stated
#         source_quote:                  optional — verbatim phrasing from the source
#     parallel_ta_facility:              technical-assistance / grant sidecar (separate from capital_stack)
#       exists: true|false
#       size_usd_m:                      nullable number
#       funder:                          free-text or null
#       source_url:                      URL where the facility is publicly stated
#     vehicle_legal_form:                free-text — "Delaware LP", "Luxembourg SCSp", "limited liability company"
#     instruments_offered:               list of capital instruments the fund deploys downstream
#                                        (senior_debt, equity, mezzanine, quasi_equity, convertible_debt,
#                                        revenue_based_loan, guarantee)
#     structure_notes:                   <=2 factual sentences with anything that doesn't fit the above
#     structure_source_urls:             primary sources used to populate this block beyond the
#                                        per-tranche source_urls (e.g. case study, DFC PIS, ADV brochure)
#
# Honest-null discipline applies to every field of blended_finance_structure.
# A missing tranche is infinitely more useful than a fabricated one. Disclosure
# rate is highest on capital_stack and instruments_offered, lowest on
# vehicle_legal_form and parallel_ta_facility — extrapolating from a 4-fund
# pilot, ~80% of funds have ≥1 capital_stack layer publicly disclosed.
#
# Fund-KPIs block (optional nested block — exemplar funds only):
#   fund_kpis:
#     scope:                fund | manager_portfolio_proxy | parent_org_proxy
#     disclosure_quality:   comprehensive | partial | scattered_milestones | placeholder_only
#     report_year:          int (most recent year a metric was published)
#     report_url:           URL of canonical impact report / page
#     report_format:        pdf | html | dashboard | annual_report_section | scattered_milestone_disclosure
#     reporting_framework_tags: [list — IRIS+, HIPSO, 2X, GRI, JII, custom, ...]
#     metrics:
#       - metric_name:        verbatim as published — never paraphrased
#         tags:               [informal cross-cut: gender, climate, agri, wash, ...]
#         value:              number or null (null if narrative-only)
#         value_text:         optional — for verbatim composites ("46% pre → 8% post")
#         unit:               free-text — "people", "%", "MT CO2e", "USD m"
#         cumulative_since:   year (null = single-period)
#         period_end:         YYYY or YYYY-MM-DD or null
#         iris_plus_id:       IRIS+ code or null (most funds publish without)
#         attribution_level:  fund_attributed | pro_rated | manager_portfolio
#                             | franchise_fi_aggregate | parent_org_aggregate
#         metric_type:        realized | target | longitudinal_outcome
#                             | cohort_outcome | survey_outcome
#         source_url:         URL where this metric appears
#         source_quote:       verbatim substring, ≤200 chars
#         caveat:             optional — methodology gaps, scope notes
#     structure_notes:        ≤2 sentences — caveats, methodology disclosures
#     structure_source_urls:  [URLs that contributed]
#
# fund_kpis is curated for ~10–15 exemplar funds spanning the disclosure
# spectrum. Most peer-fund entries will have it absent (honest null).
# The CRITICAL field is `attribution_level` per metric — without it,
# franchise-FI-aggregate numbers (e.g. "5.8M women clients at portfolio
# FIs") look indistinguishable from fund-attributed numbers.
#
# Honesty requirement:
#   If a field is not in the public record, it MUST be null. A blank field
#   is infinitely more valuable than a made-up one. A fabricated 175 bps /
#   15% carry will contaminate any aggregation and make the product dishonest.
#
# Reality: mgmt_fee_bps, carry_pct, hurdle_pct, gp_commit_pct, and
# investment_period_years are rarely disclosed for INGO-sponsored vehicles.
# Expect the disclosure rate to be low (maybe 15-25%) on the INGO side.
# Engineer: surface sample size + disclosure rate prominently in slot 4.

peer_funds:

  # ---------- INGO-sponsored vehicles ----------

