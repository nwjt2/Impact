      delivery, and digital health. First close 2023 ($50M), final close
      3 October 2024 at $111M. Catalytic capital (first-loss /
      concessional) provided by Grand Challenges Canada ($5M, ~25% of
      catalytic pool) with funding from Global Affairs Canada, USAID,
      Skoll Foundation, UBS Optimus Foundation, Anesvad Foundation,
      Netri Foundation, and Chemonics. Senior LPs: Royal Philips, IFC,
      Swedfund, US DFC, Proparco, MSD (Merck), FSD Africa Investments,
      ImpactAssets, Global Health Investment Corporation (GHIC),
      Ceniarth. Surfaces Grand Challenges Canada, Skoll Foundation,
      UBS Optimus Foundation, Anesvad Foundation, and Netri Foundation
      as foundation/public-charity LPs on /network/.

