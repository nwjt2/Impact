        source_quote: "97% of individuals directly supported by the fund's investments are women and 66% earn below a living income"
      - metric_name: Target — people reached over fund term (Fund III)
        tags: [wash, outreach]
        value: 5000000
        unit: people
        cumulative_since: 2021
        period_end: "2028"
        attribution_level: fund_attributed
        metric_type: target
        source_url: https://www.globenewswire.com/en/news-release/2022/03/31/2414126/0/en/WaterEquity-Raises-Over-150-Million-at-Final-Close-of-Global-Access-Fund.html
        source_quote: "Over its seven-year term, the Fund aims to reach 5 million people with improved access to water and sanitation across Asia, Latin America, and Africa"
      - metric_name: People reached with safe water or sanitation (total portfolio)
        tags: [wash, outreach]
        value: 7100000
        unit: people
        cumulative_since: 2016
        period_end: "2024-09-30"
        attribution_level: manager_portfolio
        metric_type: realized
        source_url: https://waterequity.com/impact-report-2024/
        source_quote: "7.1M+ people reached with safe water or sanitation"
        caveat: WaterEquity portfolio total across all four funds; Fund III contribution not disaggregated post-2022
      - metric_name: Capital deployed through financial institutions (total portfolio)
        tags: [wash, fi, financial-throughput]
        value: 440000000
        unit: USD
        cumulative_since: 2016
        period_end: "2024-12-31"
        attribution_level: manager_portfolio
        metric_type: realized
        source_url: https://waterequity.com/impact-report-2024/
        source_quote: "~$440 million through financial institutions to expand access to safe water and sanitation"
      - metric_name: Share of household microloan borrowers who are women (total portfolio)
        tags: [gender, demographic]
        value: 96
        unit: percent
        cumulative_since: 2016
        period_end: "2024-09-30"
        attribution_level: manager_portfolio
        metric_type: realized
        source_url: https://waterequity.com/impact-report-2024/
        source_quote: "96% of household microloan borrowers were women"
      - metric_name: Open defecation reduction (end-client survey)
        tags: [wash, outcome, behavioral]
        value_text: "46% pre-loan → 8% post-loan"
        unit: percent of surveyed end-clients
        period_end: "2024-09-30"
        attribution_level: manager_portfolio
        metric_type: survey_outcome
        source_url: https://waterequity.com/impact-report-2024/
        source_quote: "Open defecation 46% before the loan to 8% after the loan"
        caveat: Composite pre/post — value_text captures both before/after in one row
    structure_notes: >
      WaterEquity's public KPI disclosure is portfolio-aggregated, not
      fund-disaggregated. The 2024 Impact Report reports cumulative
      numbers across all four funds since 2016 with no Fund-III breakout.
      The only Fund-III-specific KPIs in the public record come from the
      March 2022 final-close press release covering ~17 months of
      deployment (Apr 2021 → Sep 2022). Targets at fund close: 5M people
      over 7-year term, 60% women. End-client behavioral KPIs (open
      defecation 46%→8%, 98% women QoL improvement) are a distinguishing
      feature — most peer funds report only outputs.
    structure_source_urls:
      - https://waterequity.com/impact-report-2024/
      - https://www.globenewswire.com/news-release/2024/02/28/2836910/0/en/WaterEquity-Celebrates-Five-Million-People-Reached-Globally-With-Access-to-Safe-Water-and-Sanitation.html
      - https://www.globenewswire.com/en/news-release/2022/03/31/2414126/0/en/WaterEquity-Raises-Over-150-Million-at-Final-Close-of-Global-Access-Fund.html
      - https://iris.thegiin.org/document/iris-use-case-waterequity/

