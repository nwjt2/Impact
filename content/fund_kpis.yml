      — distinct from the microfinance / agri-fund pattern. Headlines
      are four cumulative-since-2012 numbers: # portcos (76), $ deployed
      ($59.4M), # countries (30+), follow-on multiple ($13/$1) plus #
      exits (13). No annual impact report PDF; KPIs are surfaced as
      scattered milestones on the program landing page and in fund-close
      press releases. Signature metric is the $13 follow-on multiple — a
