      peer-fund universe. Three things distinguish it. (1) Full IRIS+
      code-level transparency — the 2024 Impact Report dedicates a 4-page
      Impact Data appendix tagging every one of ~40+ metrics with both
      the SDG it serves AND the exact IRIS+ ID (PI5965, PI4940, OI2496).
      Few impact funds surface IRIS+ codes this granularly. (2) Honest
      attribution language — Calvert explicitly tells investors "this
      impact was not financed solely by our capital and we do not 'take
      credit' for the full impact reported." (3) Independent verification
      + 30-year track record — BlueMark "Advanced" ratings across all 8
      Operating Principles for Impact Management, plus 100% investor
      repayment and <1% portfolio loss rate since 1995, anchor the
      impact narrative in audited financial credibility.
