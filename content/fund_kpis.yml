      co-exist (1) GCF FP005 Annual Performance Reports filed each April
      since 2018 against a board-approved logframe with baseline / target
      / realized triples — the most rigorous disclosure regime on offer,
      but the actual numbers sit inside PDFs that aren't surfaced as
