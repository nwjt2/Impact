# Curated impact-KPI gallery — exemplar peer-fund disclosures.
#
# ~11 INGO-sponsored funds spanning the disclosure spectrum:
#   comprehensive   — Root Capital, Calvert Note, Hivos-Triodos, Mercy Corps Ventures, &Green, MicroBuild
#   partial         — WaterEquity GAF III, Accion Venture Lab
#   scattered       — Acumen KawiSafi, GHIF, IDH Farmfit
#
# Why a separate file (not nested in peer_funds.yml):
#   The KPI gallery is a curated artifact for ~10–15 funds, not a 67-row
#   refresh. Keeping it on its own file means the future `/add-fund-kpis`
#   skill never races against `/add-blended-finance-structure` (both
#   would otherwise atomic-replace peer_funds.yml).
#
# Handshake (enforced by pipeline/build_slots.py::load_fund_kpis):
#   Every `slug` here must resolve to an existing slug in peer_funds.yml.
#   peer_funds.yml owns fund identity; this file owns KPI data only.
#
# Schema (per entry):
#   slug:                 must match a peer_funds.yml slug (handshake)
#   scope:                fund | manager_portfolio_proxy | parent_org_proxy
#   disclosure_quality:   comprehensive | partial | scattered_milestones | placeholder_only
#   report_year:          int — fiscal year of canonical report
#   report_url:           URL of the canonical impact-report / page
#   report_format:        pdf | html | dashboard | annual_report_section | scattered_milestone_disclosure
#   reporting_framework_tags: [iris_plus | hipso | jii | 2x | tcfd | tnfd | sdg | opim | custom | ...]
#   metrics:              list of metrics — verbatim, with source quotes
#     - metric_name:        verbatim as published — never paraphrased
#       tags:               [informal cross-cut: gender, climate, agri, wash, ...]
#       value:              number or null (null = narrative-only)
#       value_text:         optional — for verbatim composites ("46% pre → 8% post")
#       unit:               free-text — "people", "%", "MT CO2e", "USD m"
#       cumulative_since:   year (null = single-period)
#       period_end:         YYYY or YYYY-MM-DD or null
#       iris_plus_id:       IRIS+ code or null (most funds publish without)
#       attribution_level:  fund_attributed | pro_rated | manager_portfolio
#                           | franchise_fi_aggregate | parent_org_aggregate
#                           # CRITICAL — without it, franchise-aggregate
#                           # numbers look identical to fund-attributed
#       metric_type:        realized | target | longitudinal_outcome
#                           | cohort_outcome | survey_outcome
#       source_url:         URL where this metric appears
#       source_quote:       verbatim substring, ≤200 chars
#       caveat:             optional — methodology gaps, scope notes
#   structure_notes:        editorial color — what's distinctive about this fund's reporting
#   structure_source_urls:  [URLs that contributed to this extraction]

fund_kpis:

  # ----------------------------------------------------------------
  # Mercy Corps Ventures — fund-attributed, comprehensive
  # ----------------------------------------------------------------
  - slug: mercy-corps-ventures
    scope: fund
    scope_label: MCV platform, 2015–2025 (Fund I + Fund II combined)
    disclosure_quality: comprehensive
    report_year: 2025
    report_url: https://www.mercycorps.org/research-resources/ventures-annual-impact-report-2025
    report_format: pdf
    reporting_framework_tags: [imp_5_dimensions, opim, 2x_global, un_sdgs]
    metrics:
      - metric_name: New investments made
        tags: [pace, deployment]
        value: 7
        unit: companies
        period_end: "2025"
        attribution_level: fund_attributed
        metric_type: realized
        source_url: https://www.mercycorps.org/research-resources/ventures-annual-impact-report-2025
        source_quote: "7 new investments"
      - metric_name: Total portfolio companies
        tags: [pace, deployment]
        value: 61
        unit: companies
        cumulative_since: 2015
        period_end: "2025"
        attribution_level: fund_attributed
        metric_type: realized
        source_url: https://www.mercycorps.org/research-resources/ventures-annual-impact-report-2025
        source_quote: "61 companies advancing their Resilient Future Thesis"
      - metric_name: Cumulative capital catalyzed (fund-life follow-on)
        tags: [follow-on, mobilisation]
        value: 753000000
        unit: USD
        cumulative_since: 2015
        period_end: "2025"
        attribution_level: manager_portfolio
        metric_type: realized
        source_url: https://www.mercycorps.org/research-resources/ventures-annual-impact-report-2025
        source_quote: "$753M catalyzed across fund life"
        caveat: Catalyzed = total raised by portfolio companies, not MCV's check size
      - metric_name: Cumulative people reached by portfolio
        tags: [reach, customers]
        value: 46300000
        unit: people
        cumulative_since: 2015
        period_end: "2025"
        attribution_level: franchise_fi_aggregate
        metric_type: realized
        source_url: https://www.mercycorps.org/research-resources/ventures-annual-impact-report-2025
        source_quote: "46.3M people across 87 countries, including 22 Least Developed Countries"
        caveat: Aggregate of portfolio-company customer reach; counting methodology and attribution share not disclosed
      - metric_name: Countries served (cumulative)
        tags: [geography, frontier-markets]
        value: 87
        unit: countries
        cumulative_since: 2015
        period_end: "2025"
        attribution_level: franchise_fi_aggregate
        metric_type: realized
        source_url: https://www.mercycorps.org/research-resources/ventures-annual-impact-report-2025
        source_quote: "46.3M people across 87 countries, including 22 Least Developed Countries"
      - metric_name: Portfolio companies with at least one woman co-founder
        tags: [gender, 2x]
        value: 46
        unit: percent
        period_end: "2025"
        attribution_level: fund_attributed
        metric_type: realized
        source_url: https://www.mercycorps.org/research-resources/ventures-annual-impact-report-2025
        source_quote: "46% of our portfolio companies have at least one woman co-founder"
      - metric_name: Portfolio companies that have raised follow-on capital
        tags: [follow-on, graduation-rate]
        value: 83
        unit: percent
        period_end: "2025"
        attribution_level: fund_attributed
        metric_type: realized
        source_url: https://www.mercycorps.org/research-resources/ventures-annual-impact-report-2025
        source_quote: "83% of our portfolio has raised follow on capital"
      - metric_name: Customers who are women and/or smallholder farmers
        tags: [gender, agri, customer-demographics]
        value: 73
        unit: percent
        cumulative_since: 2015
        period_end: "2025"
        attribution_level: franchise_fi_aggregate
        metric_type: realized
        source_url: https://www.mercycorpsventures.com/impact
        source_quote: "73% of customers are women and/or smallholder farmers"
        caveat: Composite ratio (women OR smallholder farmers); breakouts not separately disclosed
      - metric_name: Customers gaining first-time access
        tags: [financial-inclusion, additionality]
        value: 66
        unit: percent
        cumulative_since: 2015
        period_end: "2025"
        attribution_level: franchise_fi_aggregate
        metric_type: realized
        source_url: https://www.mercycorpsventures.com/impact
        source_quote: "66% of customers are gaining first-time access to impactful products and services"
        caveat: Self-reported by portfolio companies; verification methodology not disclosed
    structure_notes: >
      One of the most disciplined annual-cadence impact-disclosure regimes
      among INGO-sponsored peer funds — eight consecutive years of
      standalone Annual Impact Reports as PDFs (2018–2025) plus a
      live-updating /impact landing page. Every headline metric is
      presented twice — report year and cumulative-since-2015 — letting
      readers separate pace from accumulated stock without arithmetic.
      Notable gaps: no jobs-created metric, no quantified climate / CO2e
      outcomes despite the "Resilient Future Thesis," no fund AUM, and
      the same $753M figure is reused for both portfolio-raised capital
      and downstream SME financing without methodological reconciliation.
    structure_source_urls:
      - https://www.mercycorpsventures.com/impact
      - https://www.mercycorps.org/research-resources/ventures-annual-impact-report-2025

