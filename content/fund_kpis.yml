      - metric_name: Portfolio companies funded
        tags: [portfolio-count]
        value: 12
        unit: companies
        cumulative_since: 2013
        period_end: "2024"
        attribution_level: fund_attributed
        metric_type: realized
        source_url: https://ghicfunds.org/global-health-investment-fund/
        source_quote: "$108 million social impact fund invested in twelve portfolio companies"
      - metric_name: EuBiologics oral cholera vaccine — modeled deaths averted (single-portco)
        tags: [lives-saved-modeled, cholera, vaccine]
        value: 100000
        value_text: "100,000 deaths averted"
        unit: deaths averted (modeled, 2015–2030)
        cumulative_since: 2015
        period_end: "2030"
        attribution_level: manager_portfolio
        metric_type: longitudinal_outcome
        source_url: https://health.bmz.de/stories/investing-in-neglected-diseases/
        source_quote: "100,000 deaths averted between 2015 and 2030"
        caveat: Forward-looking model attributed to a single portfolio company (EuBiologics / Euvichol cholera vaccine). KfW/BMZ-side disclosure; not in fund-direct reporting
      - metric_name: Strategic exits achieved (acquisitions)
        tags: [exit, m-and-a]
        value: 2
        value_text: "Themis Bioscience (Merck 2020); IanTech (Carl Zeiss Meditec 2019)"
        unit: portfolio company acquisitions
        cumulative_since: 2013
        period_end: "2024"
        attribution_level: fund_attributed
        metric_type: realized
        source_url: https://ghicfunds.org/global-health-investment-fund/
        source_quote: "Themis Bioscience ... Acquired by Merck | IanTech ... Acquired by ZEISS"
    structure_notes: >
      Instructive cautionary archetype a flagship blended-finance health
      fund that, despite stellar substantive impact (12 portfolio
      companies, 12+ products commercialized, 500m+ people reached, two
      strategic exits to Merck and Zeiss), produced no public fund-direct
      annual impact report. The manager-side artifact is a single-page
      narrative on ghicfunds.org with one headline reach number;
      everything granular flows through LP-side proxy reporting (Gates
      SIF impact stories, KfW/BMZ Healthy DEvelopments, World Bank case
      study). Three distinctive features (1) modeled lives-saved framing
      — most-cited impact figure is a 15-year forward DALY-adjacent
      projection from a single portco; (2) regulatory-milestone reporting
      (WHO PQ, FDA approvals) substitutes for IRIS+; (3) LP-as-publisher
      pattern — when the fund itself goes quiet, philanthropic LPs absorb
      the impact-narrative burden. INGO sponsors should pre-commit a
      fund-direct cadence to avoid this.
    structure_source_urls:
      - https://health.bmz.de/stories/investing-in-neglected-diseases/
      - https://sif.gatesfoundation.org/investments/ghif/
      - https://ghicfunds.org/global-health-investment-fund/
