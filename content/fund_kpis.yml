      - metric_name: Smallholders to be supported (target)
        tags: [social, smallholders, livelihoods]
        value: 9800
        unit: smallholders
        cumulative_since: 2017
        period_end: "2024"
        attribution_level: fund_attributed
        metric_type: target
        source_url: https://public.unpri.org/sail-investments-high-impact-climate-biodiversity-and-natural-capital/12830.article
        source_quote: "approximately 32 million tCO2e of emissions benefits; 25,000 jobs created; and 9,800 smallholders to be supported"
        caveat: Aggregate of investee LPP commitments — life-of-investment target, not realized at reporting date
      - metric_name: Sustainably intensified land
        tags: [agri, intensification, productivity]
        value: 247000
        unit: hectares
        cumulative_since: 2017
        period_end: "2024"
        attribution_level: fund_attributed
        metric_type: realized
        source_url: https://public.unpri.org/sail-investments-high-impact-climate-biodiversity-and-natural-capital/12830.article
        source_quote: "247,000 hectares of 'sustainably intensified land'"
        caveat: The yield-uplift-on-existing-farmland counterfactual is the engine of &Green's deforestation-avoidance theory of change
    structure_notes: >
      Frontier of nature-positive disclosure. Three things stand out for
      INGO LPs. (1) The unit of aggregation is the Landscape Protection
      Plan (LPP) — a binding, public, NDPE-anchored land-use plan signed
      by every investee. Every fund-level KPI rolls up from LPPs, which
      is why the fund can comfortably claim fund-attribution rather than
      franchise-aggregate framing. (2) Three distinct climate numbers
      that most peers conflate — a stock measure (0.8bn tCO2 in standing
      forest), a flow measure (16.3M tCO2e "climate benefits"), and an
      investee-target aggregate (~32M tCO2e). Separating stock, flow,
      and target is methodologically rare. (3) One of the earliest TNFD
      pilot adopters, moving to a combined TCFD–TNFD disclosure in 2024.
