        caveat: Cumulative figure reflects recycled capital across multiple loan rotations on the $100M base
      - metric_name: MFI investee partners (cumulative)
        tags: [partners, financial-institutions]
        value: 62
        unit: institutions
        cumulative_since: 2012
        period_end: "2024"
        attribution_level: fund_attributed
        metric_type: realized
        source_url: https://www.habitat.org/our-work/terwilliger-center-innovation-in-shelter/microbuild
        source_quote: "US$230 million across 62 institutions in 33 countries"
      - metric_name: Countries reached (cumulative)
        tags: [geography]
        value: 33
        unit: countries
        cumulative_since: 2012
        period_end: "2024"
        attribution_level: fund_attributed
        metric_type: realized
        source_url: https://world-habitat.org/world-habitat-awards/winners-and-finalists/microbuild-fund/
        source_quote: "$151.6 million USD to 59 institutions in 33 countries"
      - metric_name: Female borrowers
        tags: [gender, demographics]
        value: 80
        unit: percent
        cumulative_since: 2012
        period_end: "2022"
        attribution_level: franchise_fi_aggregate
        metric_type: realized
        source_url: https://world-habitat.org/world-habitat-awards/winners-and-finalists/microbuild-fund/
        source_quote: "1,048,720 people - 80% of whom are women"
      - metric_name: Rural borrowers
        tags: [geography, demographics]
        value: 66
        unit: percent
        cumulative_since: 2012
        period_end: "2021"
        attribution_level: franchise_fi_aggregate
        metric_type: realized
        source_url: https://triplejump.eu/fund/microbuild-fund/
        source_quote: "66% of borrowers were rural"
      - metric_name: Additional capital unlocked at investee MFIs (catalytic)
        tags: [mobilization, catalytic]
        value: 582.9
        unit: USD m
        cumulative_since: 2012
        period_end: "2022"
        attribution_level: franchise_fi_aggregate
        metric_type: realized
        source_url: https://world-habitat.org/world-habitat-awards/winners-and-finalists/microbuild-fund/
        source_quote: "more than $582.9 million USD in additional capital by investee institutions, positively impacting an additional 3.5 million people"
        caveat: Catalytic / mobilization metric. FY2024 update reported $1.22B in attracted capital
      - metric_name: Investee housing portfolio CAGR vs general portfolio
        tags: [portfolio-growth, mfi-capability]
        value_text: "25% housing CAGR vs 16.15% general portfolio"
        unit: percent CAGR
        cumulative_since: 2012
        period_end: "2024"
        attribution_level: franchise_fi_aggregate
        metric_type: longitudinal_outcome
        source_url: https://www.habitat.org/our-work/terwilliger-center-innovation-in-shelter/microbuild
        source_quote: "compounded annual growth rate, or CAGR, of 25% compared with 16.15% for the general portfolio"
        caveat: Demonstrates housing microfinance product-line outperforming MFI's general loan book
      - metric_name: Technical assistance committed
        tags: [technical-assistance]
        value: 10
        unit: USD m
        cumulative_since: 2012
        period_end: "2024"
        attribution_level: parent_org_aggregate
        metric_type: realized
        source_url: https://www.habitat.org/our-work/terwilliger-center-innovation-in-shelter/microbuild
        source_quote: "Habitat has committed at least $10 million in technical assistance"
    structure_notes: >
      One of the few INGO-sponsored housing-finance funds with mature
      lifetime reporting. Three distinctive features for housing-impact
      archetype: (1) two-stage outreach math — borrowers (~237K) plus
      implied household multiplier (~1.18M individuals), reflecting that
      a single housing loan benefits the whole co-resident family; (2)
      franchise-FI mobilization is the headline, not a footnote — $582M
      (later $1.22B) of additional capital that investee MFIs raised to
      grow housing books, plus 3.5M downstream-people figure; (3)
      product-line health metric — 25% housing-portfolio CAGR vs 16.15%
      general-portfolio CAGR at investee MFIs tests whether housing
      microfinance was actually adopted as a permanent product line.
    structure_source_urls:
      - https://www.habitat.org/our-work/terwilliger-center-innovation-in-shelter/microbuild
      - https://www.habitat.org/sites/default/files/documents/MicroBuild-FY23-Impact-Report.pdf
      - https://world-habitat.org/world-habitat-awards/winners-and-finalists/microbuild-fund/
      - https://triplejump.eu/fund/microbuild-fund/

